<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Demetri Sebastian López — AI/ML Engineer</title>
  <desc id="desc">An animated neural blueprint connecting multimodal models, agentic systems, machine learning evaluation, and production AI tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0a1b31"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#39d9ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#39d9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#80dfff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .signal { stroke-dasharray: 10 16; animation: signal-flow 5s linear infinite; }
      .node { animation: node-pulse 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node.delay-1 { animation-delay: -1.2s; }
      .node.delay-2 { animation-delay: -2.4s; }
      .focus { opacity: 0; animation-duration: 12s; animation-timing-function: linear; animation-iteration-count: infinite; }
      .focus-1 { opacity: 1; animation-name: focus-1-cycle; }
      .focus-2 { animation-name: focus-2-cycle; }
      .focus-3 { animation-name: focus-3-cycle; }
      .focus-4 { animation-name: focus-4-cycle; }
      .amber { animation: amber-pulse 2.8s ease-in-out infinite; }
      @keyframes signal-flow { to { stroke-dashoffset: -52; } }
      @keyframes node-pulse { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes focus-1-cycle { 0%, 24.99% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes focus-2-cycle { 0%, 24.99% { opacity: 0; } 25%, 49.99% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes focus-3-cycle { 0%, 49.99% { opacity: 0; } 50%, 74.99% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes focus-4-cycle { 0%, 74.99% { opacity: 0; } 75%, 99.99% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes amber-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .node, .focus, .amber { animation: none !important; }
        .focus { opacity: 0; }
        .focus-1 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="105" r="210" fill="url(#cyanGlow)"/>
  <path d="M 42 61 H 260" stroke="#39d9ff" stroke-opacity="0.7"/>
  <circle cx="276" cy="61" r="4" fill="#ffb547" class="amber"/>
  <text x="44" y="44" fill="#79e6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">PROFILE</text>

  <g fill="none" stroke-linecap="round">
    <path d="M 760 95 C 850 36, 940 54, 1020 112 S 1110 226, 1040 312" stroke="#2ccff5" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M 720 164 C 824 125, 900 170, 962 230 S 1064 298, 1140 256" stroke="#2ccff5" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M 782 322 C 844 252, 912 256, 962 230 S 1040 130, 1108 142" stroke="#2ccff5" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M 760 95 C 830 150, 882 178, 962 230" class="signal" stroke="#39d9ff" stroke-opacity="0.78" stroke-width="2.5"/>
    <path d="M 782 322 C 850 310, 914 278, 962 230" class="signal" stroke="#39d9ff" stroke-opacity="0.62" stroke-width="2.5"/>
    <path d="M 962 230 C 1024 198, 1050 162, 1108 142" class="signal" stroke="#ffb547" stroke-opacity="0.86" stroke-width="2.5"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="760" cy="95" r="8" fill="#07111f" stroke="#39d9ff" stroke-width="2" class="node"/>
    <circle cx="720" cy="164" r="5" fill="#39d9ff" class="node delay-1"/>
    <circle cx="782" cy="322" r="8" fill="#07111f" stroke="#39d9ff" stroke-width="2" class="node delay-2"/>
    <circle cx="962" cy="230" r="12" fill="#07111f" stroke="#79e6ff" stroke-width="2" class="node delay-1"/>
    <circle cx="1020" cy="112" r="6" fill="#39d9ff" class="node delay-2"/>
    <circle cx="1040" cy="312" r="7" fill="#07111f" stroke="#39d9ff" stroke-width="2" class="node"/>
    <circle cx="1108" cy="142" r="8" fill="#ffb547" class="node delay-1"/>
    <circle cx="1140" cy="256" r="5" fill="#39d9ff" class="node delay-2"/>
  </g>

  <text x="44" y="168" fill="#f4f9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.4">Demetri Sebastian López</text>
  <text x="47" y="216" fill="#79e6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" letter-spacing="3">AI/ML ENGINEER</text>
  <path d="M 47 250 H 596" stroke="#39d9ff" stroke-opacity="0.3"/>
  <g fill="#f4f9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="600">
    <text x="47" y="316" class="focus focus-1">Multimodal Models</text>
    <text x="47" y="316" class="focus focus-2">Agentic Systems</text>
    <text x="47" y="316" class="focus focus-3">ML Evaluation</text>
    <text x="47" y="316" class="focus focus-4">Production AI Tools</text>
  </g>
</svg>
